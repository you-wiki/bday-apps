<main class="store" dir="rtl">
  <div class="menu">
    <header class="menu-header">
      <a class="brand-button" routerLink="/ronni-store" aria-label="חזרה למסך הבית">
        <img ngSrc="/ronni-store/panda.webp" alt="" width="58" height="58" priority />
        <span><strong>רוני סטור</strong><small>תפריט קינוחים</small></span>
      </a>

      <nav aria-label="קטגוריות בתפריט">
        @for (category of categories; track category.id) {
          <a
            [routerLink]="['/ronni-store', category.id]"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="'פתיחת קטגוריית ' + category.title"
          >
            {{ category.title }}
          </a>
        }
      </nav>

      <div class="table-number" aria-label="מספר שולחן 19">
        <small>שולחן</small>
        <strong>19</strong>
      </div>
    </header>

    <router-outlet />

    <footer>
      <img ngSrc="/ronni-store/panda.webp" alt="" width="34" height="34" />
      <span>רוני סטור · המסעדה שבה סקווישי הוא כסף</span>
    </footer>
  </div>
</main>
