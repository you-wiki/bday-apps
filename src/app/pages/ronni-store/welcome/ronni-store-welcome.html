<main class="store" dir="rtl">
  <section class="welcome" aria-labelledby="welcome-title">
    <div class="welcome-photo">
      <img
        ngSrc="/ronni-store/pancakes-loaded.webp"
        alt="מגדל פנקייקים עם שוקולד, בננות, פירות יער ואוראו"
        fill
        priority
      />
    </div>

    <div class="welcome-copy">
      <div class="brand brand--large">
        <img ngSrc="/ronni-store/panda.webp" alt="" width="128" height="128" priority />
        <div>
          <span class="brand-kicker">מסעדת הקינוחים של</span>
          <strong>רוני סטור</strong>
        </div>
      </div>

      <div class="welcome-heading">
        <span class="eyebrow">ברוכות הבאות</span>
        <h1 id="welcome-title">מתוק בפה.<br />כואב בארנק.</h1>
        <p>
          תפריט פנדה חגיגי, מוגזם וטעים במיוחד. המסעדה היחידה בארץ שבה משלמים
          בסקווישים במקום בשקלים.
        </p>
      </div>

      <a class="primary-button" routerLink="/ronni-store/pancakes">
        <span>לתפריט שלנו</span>
        <span aria-hidden="true">←</span>
      </a>

      <p class="fine-print">לא מקבלים מזומן או אשראי. סקווישים רכים בלבד.</p>
    </div>
  </section>
</main>
